## JJTEXTILES PRODUCTION NGINX CONFIG (images alias excerpt)
##
## Copy the relevant sections into your active site config for jjtextiles.in
## Ensure the directory /var/www/jjtextiles-ecom/uploads exists and is readable by nginx

# HTTPS Main Site (snippet)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name jjtextiles.in www.jjtextiles.in;

    # SSL certificate paths should be updated accordingly
    # ssl_certificate /etc/letsencrypt/live/jjtextiles.in/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/jjtextiles.in/privkey.pem;

    # Product images
    location /images/ {
        alias /var/www/jjtextiles-ecom/uploads/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Vary "Accept";

        location ~* \.(webp)$ {
            add_header Content-Type "image/webp";
            add_header Vary "Accept";
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location ~* \.(avif)$ {
            add_header Content-Type "image/avif";
            add_header Vary "Accept";
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location ~* \.(jpg|jpeg|png)$ {
            add_header Vary "Accept";
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }

    # Optional: expose uploads directly
    location /uploads/ {
        alias /var/www/jjtextiles-ecom/uploads/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Vary "Accept";
    }
}


