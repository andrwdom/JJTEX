# ===============================================
# JJTEXTILES E-COMMERCE NGINX CONFIG
# Perfectly Tailored for Your Exact Setup
# ===============================================

# ===============================================
# RATE LIMITING (DDoS Protection) - UNIQUE ZONES TO AVOID CONFLICT
# ===============================================
limit_req_zone $binary_remote_addr zone=jjt_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=jjt_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=jjt_general:10m rate=30r/s;

# ===============================================
# UPSTREAM SERVERS (DIFFERENT PORTS TO AVOID CONFLICT WITH SHITHAA)
# Shithaa uses: 3000, 4000, 4173
# JJTextiles uses: 3001, 4100, 4174
# ===============================================
upstream jjtextiles_frontend {
    server 127.0.0.1:3001;  # Next.js (different from shithaa's 3000)
    keepalive 64;
}

upstream jjtextiles_backend {
    server 127.0.0.1:4100;  # Express API (different from shithaa's 4000, matches your .env PORT)
    keepalive 64;
}

upstream jjtextiles_admin {
    server 127.0.0.1:4173;  # Vite Preview (different from shithaa's 4173)
    keepalive 32;
}

# ===============================================
# MAIN SITE: jjtextiles.com
# ===============================================

# HTTP → HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name jjtextiles.com www.jjtextiles.com;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    return 301 https://$server_name$request_uri;
}

# MAIN HTTPS SERVER
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name jjtextiles.com www.jjtextiles.com;

    # ===============================================
    # SSL CONFIGURATION
    # ===============================================
    ssl_certificate /etc/letsencrypt/live/jjtextiles.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jjtextiles.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;

    # ===============================================
    # SECURITY HEADERS
    # ===============================================
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ===============================================
    # PERFORMANCE SETTINGS
    # ===============================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss image/svg+xml;

    client_max_body_size 50M;
    client_body_timeout 30s;
    client_header_timeout 30s;
    keepalive_timeout 65s;
    send_timeout 30s;

    # ===============================================
    # CACHE: Next.js Static Assets (DIRECT SERVING)
    # Serving directly from filesystem for better performance and correct MIME types
    # ===============================================
    location ^~ /_next/static/ {
        alias /var/www/jjtextiles/JJTEX/frontend/.next/static/;
        
        # 🚀 LONG CACHE: 1 year (build ID in filename)
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Vary "Accept-Encoding" always;
        add_header X-Content-Type-Options "nosniff" always;
        expires 1y;

        access_log off;
        tcp_nodelay on;
        tcp_nopush on;
    }

    # ===============================================
    # CACHE: Product Images (MEDIUM)
    # Your backend serves these via /uploads route
    # ===============================================
    location ^~ /uploads/ {
        proxy_pass http://jjtextiles_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 📸 MEDIUM CACHE: 30 days (product images can change)
        add_header Cache-Control "public, max-age=2592000" always;
        add_header Vary "Accept" always;
        expires 30d;

        # WebP/AVIF support
        location ~* \.(webp|avif)$ {
            proxy_pass http://jjtextiles_backend;
            add_header Content-Type "image/webp";
            add_header Vary "Accept";
            add_header Cache-Control "public, max-age=2592000";
            expires 30d;
        }
    }

    # ===============================================
    # CACHE: Images (Alternative route)
    # Your backend also serves via /images route
    # Includes carousel images at /images/carousel/
    # ===============================================
    location ^~ /images/ {
        # Check both possible paths (update to match your actual UPLOAD_PATH)
        # Option 1: /var/www/jjtextiles-ecom/uploads/ (if using this path)
        alias /var/www/jjtextiles/JJTEX/uploads/;
        # Option 2: /var/www/jjtextiles/JJTEX/uploads/ (if using this path instead)
        # alias /var/www/jjtextiles/JJTEX/uploads/;
        
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header Vary "Accept" always;
        access_log off;
        
        # Ensure carousel images are accessible
        # Carousel images are stored at: [UPLOAD_PATH]/carousel/[filename]
        # And served via: /images/carousel/[filename]
    }

    # ===============================================
    # CACHE: Static Assets (LONG)
    # ===============================================
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|avif|woff|woff2|ttf|eot|otf)$ {
        proxy_pass http://jjtextiles_frontend;

        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Vary "Accept-Encoding" always;
        expires 1y;
        access_log off;
    }

    # ===============================================
    # ZERO CACHE: API Routes (ALWAYS FRESH)
    # ===============================================
    location /api/ {
        limit_req zone=jjt_api burst=20 nodelay;

        proxy_pass http://jjtextiles_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # 🔥 ZERO CACHE: Always fresh data
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;

        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
    }

    # ===============================================
    # ZERO CACHE: HTML Pages (INSTANT UPDATES)
    # ===============================================
    location / {
        limit_req zone=jjt_general burst=50 nodelay;

        proxy_pass http://jjtextiles_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # 🔥 ZERO CACHE: Instant page updates
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;

        tcp_nodelay on;
    }

    # ===============================================
    # SEO FILES (Short cache)
    # ===============================================
    location = /robots.txt {
        proxy_pass http://jjtextiles_frontend;
        add_header Cache-Control "public, max-age=86400" always;
        expires 1d;
    }

    location = /sitemap.xml {
        proxy_pass http://jjtextiles_frontend;
        add_header Cache-Control "public, max-age=43200" always;
        expires 12h;
    }

    location = /favicon.ico {
        proxy_pass http://jjtextiles_frontend;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        expires 1y;
        access_log off;
    }
}

# ===============================================
# ADMIN PANEL: admin.jjtextiles.com
# ===============================================

# HTTP → HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name admin.jjtextiles.com;
    return 301 https://$server_name$request_uri;
}

# ADMIN HTTPS SERVER
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.jjtextiles.com;

    # ===============================================
    # SSL CONFIGURATION (Same as main site)
    # ===============================================
    ssl_certificate /etc/letsencrypt/live/jjtextiles.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jjtextiles.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ===============================================
    # SECURITY HEADERS (Admin-specific)
    # ===============================================
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Admin CSP (more permissive for admin tools)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https: http:; connect-src 'self' https://jjtextiles.com;" always;

    # ===============================================
    # PERFORMANCE (Same as main site)
    # ===============================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss image/svg+xml;

    client_max_body_size 50M;
    keepalive_timeout 65s;
    limit_req zone=jjt_general burst=30 nodelay;

    # ===============================================
    # ADMIN STATIC FILES (Your exact path)
    # ===============================================
    root /var/www/jjtextiles/JJTEX/admin/dist;
    index index.html;

    # ===============================================
    # CACHE: Admin Assets (LONG - Vite Build Hashed)
    # Vite includes hash in filename, safe to cache
    # ===============================================
    location /assets/ {
        alias /var/www/jjtextiles/JJTEX/admin/dist/assets/;

        # 🚀 LONG CACHE: 1 year (Vite hashes filenames)
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Vary "Accept-Encoding" always;
        expires 1y;
        access_log off;

        tcp_nodelay on;
        tcp_nopush on;
    }

    # ===============================================
    # ZERO CACHE: Admin API (Always fresh)
    # ===============================================
    location /api/ {
        limit_req zone=jjt_api burst=20 nodelay;

        proxy_pass http://jjtextiles_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # 🔥 ZERO CACHE: Admin API always fresh
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;

        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
    }

    # ===============================================
    # CACHE: Upload Images (For admin previews)
    # ===============================================
    location ^~ /uploads/ {
        alias /var/www/jjtextiles/JJTEX/uploads/;

        # 📸 MEDIUM CACHE: 30 days
        add_header Cache-Control "public, max-age=2592000" always;
        add_header Vary "Accept" always;
        expires 30d;
    }

    location ^~ /images/ {
        # Check both possible paths (update to match your actual UPLOAD_PATH)
        # Option 1: /var/www/jjtextiles/JJTEX/uploads/ (if using this path)
        alias /var/www/jjtextiles/JJTEX/uploads/;
        # Option 2: /var/www/jjtextiles/JJTEX/uploads/ (if using this path instead)
        # alias /var/www/jjtextiles/JJTEX/uploads/;

        # 📸 MEDIUM CACHE: 30 days
        add_header Cache-Control "public, max-age=2592000" always;
        add_header Vary "Accept" always;
        expires 30d;
        
        # Ensure carousel images are accessible
        # Carousel images are stored at: [UPLOAD_PATH]/carousel/[filename]
        # And served via: /images/carousel/[filename]
    }

    # ===============================================
    # FAVICON & STATIC ASSETS
    # ===============================================
    location = /favicon.png {
        alias /var/www/jjtextiles/JJTEX/admin/dist/favicon.png;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        expires 1y;
        access_log off;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        expires 1y;
        access_log off;
    }

    # ===============================================
    # SPA ROUTING (Fallback to index.html)
    # ===============================================
    location / {
        try_files $uri $uri/ /index.html;

        # 🔥 ZERO CACHE: Admin HTML (instant updates)
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }
}

# ===============================================
# LOGGING
# ===============================================
access_log /var/log/nginx/jjtextiles_access.log;
error_log /var/log/nginx/jjtextiles_error.log warn;

